name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::KUBE_CONFIG secret이 비어 있습니다."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check secret prerequisites
        run: |
          set -euo pipefail
          kubectl cluster-info
          for name in postgres-secret server-env; do
            if ! kubectl -n fowoco get secret/"$name" >/dev/null 2>&1; then
              echo "::error::secret/$name이 없습니다. infra Wiki의 Deployment Guide를 참고해 먼저 생성해 주세요 (Secret은 git으로 관리하지 않음)."
              exit 1
            fi
          done

      - name: Checkout infra manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fowoco/infra
          path: infra

      - name: Bootstrap k8s resources
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s/00-namespace.yaml
          kubectl apply -f infra/k8s/01-postgres.yaml
          kubectl apply -f infra/k8s/02-server.yaml
          kubectl -n fowoco rollout status statefulset/postgres --timeout=60s

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fowoco/server:latest
            ghcr.io/fowoco/server:${{ github.sha }}

      - name: Rollout
        run: |
          set -euo pipefail
          kubectl -n fowoco set image deployment/server \
            server=ghcr.io/fowoco/server:${{ github.sha }}
          kubectl -n fowoco rollout status deployment/server --timeout=180s

      - name: Smoke health endpoints
        run: |
          set -euo pipefail
          kubectl -n fowoco exec deployment/server -- \
            curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness
          kubectl -n fowoco exec deployment/server -- \
            curl --fail --silent --show-error http://127.0.0.1:8080/health

      - name: Rollout diagnostics
        if: failure()
        run: |
          kubectl -n fowoco get pods -o wide || true
          kubectl -n fowoco describe deployment/server || true
          for pod in $(kubectl -n fowoco get pods -l app=server -o name); do
            echo "===== $pod current logs ====="
            kubectl -n fowoco logs "$pod" --tail=150 --all-containers || true
            echo "===== $pod previous logs ====="
            kubectl -n fowoco logs "$pod" --previous --tail=150 --all-containers || true
          done
          kubectl -n fowoco get events --sort-by=.lastTimestamp | tail -n 80 || true

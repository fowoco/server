spring:
  application:
    name: fowoco-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        fowoco.ai.pipeline.stage: true
        fowoco.renewal.stage: true

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  database:
    tenant-context-mode: transaction-only
    runtime-timeout:
      statement-timeout: ${DB_STATEMENT_TIMEOUT:30s}
      lock-timeout: ${DB_LOCK_TIMEOUT:3s}
  ai-runtime:
    enabled: ${AI_RUNTIME_ENABLED:false}
    endpoint: ${AI_RUNTIME_ENDPOINT:http://127.0.0.1:8000/internal/v1/analyses}
    renewal-endpoint: ${AI_RUNTIME_RENEWAL_ENDPOINT:http://127.0.0.1:8000/internal/v1/workflows/renewal/run}
    document-generation-endpoint: ${AI_DOCUMENT_GENERATION_ENDPOINT:http://127.0.0.1:8000/api/v1/documents/generate}
    document-conversion-endpoint: ${AI_DOCUMENT_CONVERSION_ENDPOINT:http://127.0.0.1:8000/api/v1/documents/convert}
    document-conversion-timeout: ${AI_DOCUMENT_CONVERSION_TIMEOUT:60s}
    service-credential: ${AI_RUNTIME_SERVICE_CREDENTIAL:}
    connect-timeout: ${AI_RUNTIME_CONNECT_TIMEOUT:2s}
    overall-timeout: ${AI_RUNTIME_OVERALL_TIMEOUT:300s}
    max-response-bytes: ${AI_RUNTIME_MAX_RESPONSE_BYTES:1048576}
    max-document-response-bytes: ${AI_DOCUMENT_GENERATION_MAX_RESPONSE_BYTES:20971520}
    max-concurrent-calls: ${AI_RUNTIME_MAX_CONCURRENT_CALLS:8}
    circuit-breaker-failure-threshold: ${AI_RUNTIME_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    circuit-breaker-open-duration: ${AI_RUNTIME_CIRCUIT_BREAKER_OPEN_DURATION:30s}
  worker-import:
    source-retention: ${WORKER_IMPORT_SOURCE_RETENTION:7d}
  worker-link:
    portal-base-url: ${WORKER_PORTAL_BASE_URL:http://localhost:5173}
    sms:
      provider: ${WORKER_LINK_SMS_PROVIDER:none}
      endpoint: ${SOLAPI_ENDPOINT:https://api.solapi.com/messages/v4/send-many/detail}
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      sender-number: ${SOLAPI_SENDER_NUMBER:}
      connect-timeout: ${WORKER_LINK_SMS_CONNECT_TIMEOUT:2s}
      overall-timeout: ${WORKER_LINK_SMS_OVERALL_TIMEOUT:5s}
      max-response-bytes: ${WORKER_LINK_SMS_MAX_RESPONSE_BYTES:65536}
  ai-ocr:
    enabled: ${AI_OCR_ENABLED:false}
    endpoint: ${AI_OCR_ENDPOINT:http://127.0.0.1:8000/internal/v1/ocr/worker-documents}
    service-credential: ${AI_OCR_SERVICE_CREDENTIAL:}
    connect-timeout: ${AI_OCR_CONNECT_TIMEOUT:2s}
    overall-timeout: ${AI_OCR_OVERALL_TIMEOUT:20s}
    max-response-bytes: ${AI_OCR_MAX_RESPONSE_BYTES:1048576}
    max-concurrent-calls: ${AI_OCR_MAX_CONCURRENT_CALLS:4}
    circuit-breaker-failure-threshold: ${AI_OCR_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
    circuit-breaker-open-duration: ${AI_OCR_CIRCUIT_BREAKER_OPEN_DURATION:30s}
  document:
    ocr:
      enabled: ${DOCUMENT_OCR_ENABLED:false}
      encryption-key-base64: ${OCR_RESULT_ENCRYPTION_KEY_BASE64:}
      key-version: ${OCR_RESULT_KEY_VERSION:local-v1}
  ai-run:
    sse:
      timeout: ${AI_RUN_SSE_TIMEOUT:5m}
      heartbeat-interval: ${AI_RUN_SSE_HEARTBEAT_INTERVAL:15s}
      history-retention: ${AI_RUN_SSE_HISTORY_RETENTION:10m}
      history-size: ${AI_RUN_SSE_HISTORY_SIZE:20}
      max-connections-per-user-run: ${AI_RUN_SSE_MAX_CONNECTIONS:2}
  reliability:
    outbox:
      enabled: ${OUTBOX_ENABLED:true}
      poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
      batch-size: ${OUTBOX_BATCH_SIZE:20}
      lease-duration: ${OUTBOX_LEASE_DURATION:5m}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
      initial-backoff: ${OUTBOX_INITIAL_BACKOFF:1s}
      max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
  workflow:
    catalog:
      location: ${WORKFLOW_CATALOG_LOCATION:classpath:workflow/catalog-projection.local.json}
      allow-unreleased: ${WORKFLOW_CATALOG_ALLOW_UNRELEASED:true}
  stay-verification:
    scheduler-enabled: ${STAY_VERIFICATION_SCHEDULER_ENABLED:true}
    scan-cron: ${STAY_VERIFICATION_SCAN_CRON:0 10 2 * * *}
  file-storage:
    local-path: ${FILE_STORAGE_LOCAL_PATH:./data/files}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  observability:
    # 비어 있으면(기본값) /actuator/prometheus는 SecurityConfig에서 전부 거부된다.
    prometheus-scrape-password: ${PROMETHEUS_SCRAPE_PASSWORD:}
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    company-id: ${DEMO_SEED_COMPANY_ID:90000000-0000-0000-0000-000000000001}
    company-name: ${DEMO_SEED_COMPANY_NAME:FOWOCO Demo Company}
    test-company-id: ${DEMO_SEED_TEST_COMPANY_ID:91000000-0000-0000-0000-000000000001}
    test-company-name: ${DEMO_SEED_TEST_COMPANY_NAME:FOWOCO Test Company}
    admin-user-id: ${DEMO_SEED_ADMIN_USER_ID:90000000-0000-0000-0000-000000000002}
    admin-display-name: ${DEMO_SEED_ADMIN_DISPLAY_NAME:데모 관리자}
    admin-email: ${DEMO_SEED_ADMIN_EMAIL:demo.admin@example.com}
    admin-password: ${DEMO_SEED_ADMIN_PASSWORD:}
  demo-document-data:
    command: ${DEMO_DOCUMENT_DATA_COMMAND:none}
  auth:
    jwt:
      issuer: ${JWT_ISSUER:fowoco-server}
      audience: ${JWT_AUDIENCE:fowoco-client}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token:
      ttl: ${REFRESH_TOKEN_TTL:14d}
      cookie:
        name: ${REFRESH_TOKEN_COOKIE_NAME:fowoco_refresh_token}
        path: /api/v1/auth
        same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
    password-reset:
      ttl: ${PASSWORD_RESET_TTL:30m}
      cooldown: ${PASSWORD_RESET_COOLDOWN:1m}
      minimum-response-time: ${PASSWORD_RESET_MINIMUM_RESPONSE_TIME:250ms}
      notification:
        provider: ${PASSWORD_RESET_NOTIFICATION_PROVIDER:none}
        from: ${PASSWORD_RESET_MAIL_FROM:}
        reset-url: ${PASSWORD_RESET_CLIENT_URL:http://localhost:5173/reset-password}
        subject: ${PASSWORD_RESET_MAIL_SUBJECT:FOWOCO 비밀번호 재설정}
      rate-limit:
        max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:10}
        window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:10m}
    agreements:
      service-terms-version: ${SERVICE_TERMS_VERSION:1.0}
      privacy-policy-version: ${PRIVACY_POLICY_VERSION:1.0}
      marketing-version: ${MARKETING_TERMS_VERSION:1.0}

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:--}]"
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:fowoco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # H2 2.4.240은 CHECK 제약을 만든 세션이 닫히면 다른 세션의 갱신에서
      # "database has been closed"를 반환한다. 로컬 JVM 수명 동안 Flyway의
      # 물리 연결을 유지해 30분 이후 수동 E2E가 중단되지 않게 한다.
      max-lifetime: 0
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
app:
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    refresh-token:
      cookie:
        secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fowoco}
    username: ${DB_RUNTIME_USERNAME}
    password: ${DB_RUNTIME_PASSWORD}
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fowoco}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations:
      - classpath:db/migration
      - classpath:db/migration-postgresql
  jpa:
    show-sql: true
app:
  database:
    tenant-context-mode: postgresql
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
  auth:
    jwt:
      issuer: ${JWT_ISSUER:fowoco-server-dev}
      audience: ${JWT_AUDIENCE:fowoco-client-dev}
      secret-base64: ${JWT_SECRET_BASE64}
    refresh-token:
      cookie:
        secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:fowoco-test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false
app:
  reliability:
    outbox:
      enabled: false
  stay-verification:
    scheduler-enabled: false
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    refresh-token:
      cookie:
        secure: false
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_RUNTIME_USERNAME}
    password: ${DB_RUNTIME_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations:
      - classpath:db/migration
      - classpath:db/migration-postgresql
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  database:
    tenant-context-mode: postgresql
  demo-seed:
    enabled: false
  workflow:
    catalog:
      location: ${WORKFLOW_CATALOG_LOCATION}
      allow-unreleased: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      secret-base64: ${JWT_SECRET_BASE64}
    refresh-token:
      cookie:
        secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}

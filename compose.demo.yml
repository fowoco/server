name: fowoco-server-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fowoco
      POSTGRES_USER: fowoco
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?DEMO_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fowoco -d fowoco"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fowoco-postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: fowoco-server:demo-local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/fowoco
      DB_RUNTIME_USERNAME: fowoco
      DB_RUNTIME_PASSWORD: ${DEMO_DB_PASSWORD:?DEMO_DB_PASSWORD must be set}
      DB_MIGRATION_USERNAME: fowoco
      DB_MIGRATION_PASSWORD: ${DEMO_DB_PASSWORD:?DEMO_DB_PASSWORD must be set}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      REFRESH_TOKEN_COOKIE_SECURE: "false"
      PASSWORD_RESET_NOTIFICATION_PROVIDER: ${PASSWORD_RESET_NOTIFICATION_PROVIDER:-none}
      PASSWORD_RESET_CLIENT_URL: ${PASSWORD_RESET_CLIENT_URL:-http://localhost:5173/reset-password}
      PASSWORD_RESET_MAIL_FROM: ${PASSWORD_RESET_MAIL_FROM:-}
      PASSWORD_RESET_MAIL_SUBJECT: ${PASSWORD_RESET_MAIL_SUBJECT:-FOWOCO 비밀번호 재설정}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:-5000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:-5000}
      AI_RUNTIME_ENABLED: ${AI_RUNTIME_ENABLED:-false}
      FOWOCO_AI_BASE_URL: ${FOWOCO_AI_BASE_URL:-http://host.docker.internal:8000}
      FOWOCO_AI_INTERNAL_TOKEN: ${FOWOCO_AI_INTERNAL_TOKEN:-}
      AI_RUNTIME_OVERALL_TIMEOUT: ${AI_RUNTIME_OVERALL_TIMEOUT:-240s}
      WORKER_PORTAL_BASE_URL: ${WORKER_PORTAL_BASE_URL:-http://localhost:5173}
      WORKER_LINK_SMS_PROVIDER: ${WORKER_LINK_SMS_PROVIDER:-none}
      SOLAPI_ENDPOINT: ${SOLAPI_ENDPOINT:-https://api.solapi.com/messages/v4/send-many/detail}
      SOLAPI_API_KEY: ${SOLAPI_API_KEY:-}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET:-}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER:-}
      AI_OCR_ENABLED: ${AI_OCR_ENABLED:-false}
      AI_OCR_ENDPOINT: ${AI_OCR_ENDPOINT:-http://host.docker.internal:8000/internal/v1/ocr/worker-documents}
      AI_OCR_SERVICE_CREDENTIAL: ${AI_OCR_SERVICE_CREDENTIAL:-}
      DOCUMENT_OCR_ENABLED: ${DOCUMENT_OCR_ENABLED:-false}
      OCR_RESULT_ENCRYPTION_KEY_BASE64: ${OCR_RESULT_ENCRYPTION_KEY_BASE64:-}
      OCR_RESULT_KEY_VERSION: ${OCR_RESULT_KEY_VERSION:-demo-v1}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      DEMO_SEED_ADMIN_PASSWORD: ${DEMO_SEED_ADMIN_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fowoco-postgres-data:
